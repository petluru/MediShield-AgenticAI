[project]
name = "medishield-intake"
version = "0.1.0"
description = "MediShield AI-Powered Multi-Agent Document Intake System — LangGraph multi-agent claims pipeline with Advanced RAG (Docling), FastAPI ingestion API, evals/guardrails, and prompt-injection defenses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "karthikeya" }]

dependencies = [
    # --- LLM / agent orchestration ---
    "anthropic>=0.40.0",
    "langchain>=0.3.14",
    "langchain-anthropic>=0.3.4",
    "langchain-community>=0.3.14",
    "langchain-text-splitters>=0.3.4",
    "langgraph>=0.2.62",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "langsmith>=0.2.10",
    # --- Advanced RAG / document parsing ---
    "docling>=2.15.1",
    "chromadb>=0.5.23",
    "rank-bm25>=0.2.2",
    # --- MCP ---
    "mcp>=1.1.2",
    # --- Ingestion API ---
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "websockets>=14.1",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    # --- Data / dataset generation ---
    "pillow>=11.0.0",
    "numpy>=2.2.0",
    "fpdf2>=2.8.2",
    # --- Utilities ---
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.1",
    "httpx>=0.28.1",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
]
evals = [
    "scikit-learn>=1.6.0",
    "matplotlib>=3.10.0",
    "pandas>=2.2.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
